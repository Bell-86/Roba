<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 145" width="420" height="145">
  <defs>
    <!-- Subtle organic ink filter for authentic ballpoint pen texture -->
    <filter id="ballpoint-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.45" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g fill="none" stroke="#182B7A" stroke-linecap="round" stroke-linejoin="round" filter="url(#ballpoint-ink)">
    
    <!-- 1. ქართული ასო "ნ" (ზუსტი მოხაზულობით, წვრილი კალმის ხაზით) -->
    <!-- ზედა დახრილი შტრიხი -->
    <path d="M 93.5 18.2 C 68.0 25.0, 38.0 33.5, 22.5 39.2" stroke-width="1.85" opacity="0.95"/>
    <!-- "ნ"-ის მარცხენა ვერტიკალი და ქვედა მარყუჟი -->
    <path d="M 24.2 38.8 C 19.5 47.5, 16.2 59.0, 17.5 66.8 C 18.8 74.5, 27.5 76.2, 37.5 73.2 C 48.0 70.0, 56.5 61.5, 55.2 53.8 C 54.0 46.5, 42.5 45.2, 31.5 51.5 C 24.5 55.5, 19.8 61.5, 18.5 67.2" stroke-width="1.75" opacity="0.96"/>

    <!-- 2. პირველი წერტილი "ნ"-ის შემდეგ -->
    <circle cx="77.5" cy="72.5" r="1.55" fill="#182B7A" stroke="none" opacity="0.95"/>

    <!-- 3. ცენტრალური ელემენტი ("უ"-ს მსგავსი მოხაზულობა და გრძელი ქვედა შტრიხი) -->
    <path d="M 96.5 61.0 C 96.2 68.5, 99.8 73.5, 106.2 71.0 C 113.5 68.2, 124.5 53.0, 134.8 34.5 C 126.5 54.5, 114.2 87.5, 101.5 104.5 C 88.5 121.8, 69.0 130.5, 46.5 130.2 C 32.5 130.0, 21.0 127.2, 14.0 123.5" stroke-width="1.8" opacity="0.95"/>

    <!-- 4. ცენტრალური "3"-ის მსგავსი ორმაგი რკალი -->
    <path d="M 134.8 34.5 C 143.5 34.2, 149.5 38.5, 148.5 46.8 C 147.5 54.8, 139.5 61.5, 132.5 64.2 C 144.5 63.8, 155.5 69.5, 154.8 81.5 C 154.0 94.5, 139.5 107.5, 121.5 110.2 C 107.5 112.2, 95.5 106.5, 92.5 98.5" stroke-width="1.75" opacity="0.95"/>

    <!-- 5. მეორე წერტილი ცენტრალური ელემენტის ქვემოთ -->
    <circle cx="169.5" cy="89.5" r="1.5" fill="#182B7A" stroke="none" opacity="0.95"/>

    <!-- 6. მარჯვენა მარყუჟი და გრძელი ზედა თაღი -->
    <path d="M 178.5 72.5 C 185.5 60.5, 199.5 53.5, 213.5 56.2 C 225.5 58.5, 231.5 67.5, 227.5 74.5 C 223.8 80.8, 214.2 80.2, 209.5 73.2 C 204.5 65.8, 208.5 52.5, 222.5 41.2 C 242.5 25.0, 276.5 14.5, 314.5 16.5 C 331.5 17.4, 344.5 19.8, 353.5 22.2" stroke-width="1.7" opacity="0.94"/>

    <!-- 7. მარჯვენა ტალღოვანი დაბოლოება -->
    <path d="M 317.5 48.5 C 321.5 40.5, 329.5 39.2, 336.5 45.8 C 343.5 52.5, 348.5 59.5, 355.5 58.2 C 362.5 56.8, 368.5 45.5, 377.5 36.5 C 386.5 27.5, 396.5 24.5, 406.5 26.2" stroke-width="1.75" opacity="0.95"/>

  </g>
</svg>